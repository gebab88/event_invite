<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Garden scene with foliage and string lights">
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fbeed6" />
      <stop offset="60%" stop-color="#efd9b4" />
      <stop offset="100%" stop-color="#d7b88a" />
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a8a55" />
      <stop offset="100%" stop-color="#4d5a36" />
    </linearGradient>
    <radialGradient id="bulb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4c2" />
      <stop offset="60%" stop-color="#f4d27a" />
      <stop offset="100%" stop-color="#caa54a" />
    </radialGradient>
  </defs>

  <!-- Sky / background -->
  <circle cx="100" cy="100" r="100" fill="url(#sky)" />

  <!-- Distant trees silhouette -->
  <g fill="#8a9a64" opacity="0.55">
    <ellipse cx="35" cy="120" rx="28" ry="22" />
    <ellipse cx="75" cy="115" rx="34" ry="26" />
    <ellipse cx="130" cy="118" rx="32" ry="24" />
    <ellipse cx="170" cy="123" rx="26" ry="20" />
  </g>

  <!-- Lawn -->
  <path d="M0 140 Q 60 130 100 138 T 200 142 L 200 200 L 0 200 Z" fill="url(#ground)" />

  <!-- String of lights -->
  <path d="M -5 70 Q 60 50 100 65 T 205 60" stroke="#5a4a36" stroke-width="0.8" fill="none" />
  <g>
    <circle cx="20" cy="65" r="3.2" fill="url(#bulb)" />
    <circle cx="45" cy="58" r="3.2" fill="url(#bulb)" />
    <circle cx="70" cy="55" r="3.2" fill="url(#bulb)" />
    <circle cx="95" cy="60" r="3.2" fill="url(#bulb)" />
    <circle cx="120" cy="58" r="3.2" fill="url(#bulb)" />
    <circle cx="145" cy="56" r="3.2" fill="url(#bulb)" />
    <circle cx="170" cy="58" r="3.2" fill="url(#bulb)" />
    <circle cx="195" cy="62" r="3.2" fill="url(#bulb)" />
  </g>
  <!-- Soft glow halos -->
  <g opacity="0.35">
    <circle cx="20" cy="65" r="7" fill="#fff1b8" />
    <circle cx="45" cy="58" r="7" fill="#fff1b8" />
    <circle cx="70" cy="55" r="7" fill="#fff1b8" />
    <circle cx="95" cy="60" r="7" fill="#fff1b8" />
    <circle cx="120" cy="58" r="7" fill="#fff1b8" />
    <circle cx="145" cy="56" r="7" fill="#fff1b8" />
    <circle cx="170" cy="58" r="7" fill="#fff1b8" />
    <circle cx="195" cy="62" r="7" fill="#fff1b8" />
  </g>

  <!-- Foreground foliage left -->
  <g fill="#3f5028">
    <path d="M0 200 Q 8 150 22 142 Q 30 155 26 170 Q 38 158 44 172 Q 38 188 28 192 Q 30 200 30 200 Z" />
    <path d="M10 200 Q 14 175 30 168 Q 34 182 28 196 Z" fill="#536a35" />
  </g>

  <!-- Foreground foliage right -->
  <g fill="#3f5028">
    <path d="M200 200 Q 192 152 176 144 Q 168 158 174 172 Q 160 158 156 174 Q 164 188 174 192 Q 172 200 172 200 Z" />
    <path d="M190 200 Q 186 175 170 168 Q 166 182 172 196 Z" fill="#536a35" />
  </g>

  <!-- Two warm flower hints -->
  <circle cx="22" cy="155" r="2.4" fill="#d97a5a" />
  <circle cx="178" cy="158" r="2.4" fill="#d97a5a" />
  <circle cx="32" cy="162" r="1.8" fill="#e6a76a" />
  <circle cx="168" cy="165" r="1.8" fill="#e6a76a" />
</svg>
